title: ShibaX1 India Geodata
description: "Download India's open geospatial data — administrative boundaries, district maps, electoral constituencies, census geometries, forest cover, nighttime lights, rural roads, and more. Free GIS shapefiles, GeoJSON, Parquet, and PMTiles."
baseurl: "/shibax1"
url: "https://shibasisn2-lgtm.github.io"

author:
  name: ShibaX1
social:
  name: ShibaX1
  links:
    - https://github.com/shibasisn2-lgtm

# This site is a fork. The underlying data compilation was created by
# Yashveer Singh and is reused here under CC BY 4.0.
original:
  name: Yashveer Singh
  url: https://github.com/yashveeeeeeer
  source: https://github.com/yashveeeeeeer/india-geodata

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
